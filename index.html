<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>구장예약현황</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1 class="main-title">구장예약현황</h1>
    </div>

    <!-- NOTICE ACCORDION -->
    <details class="notice-details">
        <summary class="notice-summary">
            📢 공지사항 (터치하여 접기/펼치기)
        </summary>
        <div class="notice-content">
            <strong>구장 이용 수칙 및 예약 안내</strong>
            <ul>
                <li>예약 취소 및 변경은 이용 1일 전까지만 가능합니다.</li>
                <li>구장 내 음식물 반입 및 취사는 엄격히 금지됩니다.</li>
                <li>원하는 요일 버튼을 터치하면 해당 요일의 신규 예약을 바로 신청할 수 있습니다.</li>
            </ul>
        </div>
    </details>

    <!-- STADIUM TABS -->
    <div class="tabs">
        <button class="tab-btn active">실내</button>
        <button class="tab-btn">야외1</button>
        <button class="tab-btn">야외2</button>
        <button class="tab-btn">야외3</button>
    </div>

    <!-- TIME FILTER BUTTONS (요청하신 5개 세분화 시간대) -->
    <div class="time-filter-container">
        <button class="filter-btn active" onclick="filterTime('all', this)">전체</button>
        <button class="filter-btn" onclick="filterTime('t06_11', this)">06~11시</button>
        <button class="filter-btn" onclick="filterTime('t09_14', this)">09~14시</button>
        <button class="filter-btn" onclick="filterTime('t12_17', this)">12~17시</button>
        <button class="filter-btn" onclick="filterTime('t15_20', this)">15~20시</button>
        <button class="filter-btn" onclick="filterTime('t18_23', this)">18~23시</button>
    </div>

    <!-- TIMETABLE -->
    <div class="timetable-container">
        <table class="timetable">
            <thead>
                <tr>
                    <th class="time-col"></th>
                    <th><button class="day-header-btn"></button></th>
                    <th><button class="day-header-btn"></button></th>
                    <th><button class="day-header-btn"></button></th>
                    <th><button class="day-header-btn"></button></th>
                    <th><button class="day-header-btn"></button></th>
                    <th><button class="day-header-btn"></button></th>
                    <th><button class="day-header-btn"></button></th>
                </tr>
            </thead>
            <tbody id="timetable-body">
            </tbody>
        </table>
    </div>
</div>

<!-- MODALS -->
<div id="modal-create" class="modal-overlay">
    <div class="modal-card create">
        <div class="modal-header">
            <div>
                <span class="modal-title">[신규 예약]</span>
                <span id="create-stadium-badge" class="selected-day-badge" style="background:#64748b;">실내</span>
                <span id="create-day-badge" class="selected-day-badge">07/29(수)</span>
            </div>
            <button class="close-btn" onclick="closeModal('modal-create')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <label for="create-day">선택일자</label>
                <select id="create-day"></select>
                
                <label for="create-start">시작시간</label>
                <select id="create-start"></select>
                
                <label for="create-end">종료시간</label>
                <select id="create-end"></select>
                
                <label for="create-id">ID</label>
                <input type="tel" id="create-id" placeholder="전화번호 입력 (- 제외)">
                
                <label for="create-pw">PW</label>
                <div class="password-wrapper">
                    <input type="password" id="create-pw" placeholder="비밀번호 입력">
                    <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('create-pw', this)">👁️</button>
                </div>
            </div>

            <div class="agreement-box">
                <input type="checkbox" id="create-agree">
                <label for="create-agree">[필수] 구장 이용 수칙 및 개인정보 이용에 동의합니다.</label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-gray" onclick="closeModal('modal-create')">취소</button>
            <button class="btn btn-blue" onclick="submitCreate()">저장</button>
        </div>
    </div>
</div>

<div id="modal-edit" class="modal-overlay">
    <div class="modal-card edit">
        <div class="modal-header">
            <span class="modal-title">[예약 수정 / 삭제]</span>
            <button class="close-btn" onclick="closeModal('modal-edit')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-grid">
                <label for="edit-start">시작시간</label>
                <select id="edit-start" disabled>
                    <option id="edit-start-opt">17:00</option>
                </select>
                <label for="edit-end">종료시간</label>
                <select id="edit-end">
                    <option>18:00</option><option>19:00</option><option>20:00</option>
                </select>
                <label for="edit-id">ID</label>
                <input type="text" id="edit-id" value="" readonly>
                <label for="edit-pw">PW</label>
                <div class="password-wrapper">
                    <input type="password" id="edit-pw" placeholder="비밀번호 확인">
                    <button type="button" class="pw-toggle-btn" onclick="togglePasswordVisibility('edit-pw', this)">👁️</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-gray" onclick="closeModal('modal-edit')">닫기</button>
            <button class="btn btn-gray-dark" onclick="submitDelete()">삭제</button>
            <button class="btn btn-red" onclick="submitEdit()">수정</button>
        </div>
    </div>
</div>

<div id="toast-message" class="toast">✓ 처리되었습니다.</div>

<script src="script.js"></script>
</body>
</html>
